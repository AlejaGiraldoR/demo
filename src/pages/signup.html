<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ListUp - Registro</title>
  <link rel="stylesheet" href="../../public/css/styles.css">
</head>
<body>
  <div class="container">
    
    <!-- Sección Izquierda: Formulario -->
    <div class="form-container">
      <h2>REGISTRARSE</h2>
      
      <form id="sign-up">
        <label for="name">Nombre:</label>
        <input type="text" id="name" name="firstName"  placeholder="Nombre" required>

        <label for="lastname">apellido:</label>
        <input type="text" id="lastname" name="lastName" placeholder="Apellido" required>

        <label for="age">Edad:</label>
        <input type="number" id="age" name="age" min="13" placeholder="Tu edad" required>

        <label for="email">Correo:</label>
        <input type="email" id="email" name="email" placeholder="ejemplo@correo.com" required>
        
        <label for="password">Contraseña:</label>
        <input type="password" id="password" name="password" placeholder="••••••••" required>
        
        <label for="confirm-password">Confirmar contraseña:</label>
        <input type="password" id="confirm-password" name="confirmPassword" placeholder="••••••••" required>
        
        <button type="submit">REGISTRARME</button>
      </form>

      <!-- Link para volver al login -->
      <a href="index.html" class="back-login">¿Ya tienes cuenta? Inicia sesión</a>
    </div>
    
    <!-- Sección Derecha: Logo -->
    <div class="logo-container">
      <img src="https://img.icons8.com/ios-filled/100/000000/todo-list.png" alt="Logo">
      <h1>ListUp</h1>
    </div>
    
  </div>
  <script src="../../public/js/auth.js"></script>
</body>
</html>
