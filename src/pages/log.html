<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ListUp - Inicio de Sesión</title>
  <link rel="stylesheet" href="../../public/css/styles.css">
  <code ></code>
</head>
<body>
  <div class="container">
    
    <!-- Sección Izquierda: Formulario -->
    <div class="form-container">
      <h2>INICIAR SESIÓN</h2>
      
      <form>
        <label for="email">Correo:</label>
        <input type="email" id="email" placeholder="ejemplo@correo.com" required>
        
        <label for="password">Contraseña:</label>
        <input type="password" id="password" placeholder="• • • • • • • •" required>
        
        <a href="forgot.html" class="forgot">¿Olvidaste tu contraseña?</a>
        <a href="signup.html" class="register-link">¿Deseas registrarte?</a>

        <button type="submit">INGRESAR</button>
      </form>
    </div>
    
    <!-- Sección Derecha: Logo -->
    <div class="logo-container">
      <img src="https://img.icons8.com/ios-filled/100/000000/todo-list.png" alt="Logo">
      <h1>ListUp</h1>
    </div>
    
  </div>
</body>
</html>
