<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Editar Perfil</title>
  <link rel="stylesheet" href="../../public/css/styles.css">
</head>
<body>
  <div class="container">
    <!-- Panel izquierdo -->
    <div class="form-container">
      <h2>EDITAR PERFIL</h2>
      <form id="editProfileForm">
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" name="nombre" value="Nombre actual" required>

        <label for="apellido">Apellido:</label>
        <input type="text" id="apellido" name="apellido" value="Apellido actual" required>

        <label for="correo">Correo:</label>
        <input type="email" id="correo" name="correo" value="correo@ejemplo.com" required>

        <label for="usuario">Usuario:</label>
        <input type="text" id="usuario" name="usuario" value="UsuarioActual" required>

        <label for="clave">Contraseña:</label>
        <input type="password" id="clave" name="clave" placeholder="••••••••" required>

        <div class="button-group">
          <button type="submit" class="btn-guardar">GUARDAR CAMBIOS</button>
          <button type="button" class="btn-cancelar" onclick="cancelarEdicion()">CANCELAR</button>
        </div>
      </form>
    </div>

    <!-- Panel derecho -->
    <div class="logo-container">
      <img src="https://img.icons8.com/ios-filled/100/000000/todo-list.png" alt="Logo ListUp">
      <h1>ListUp</h1>
    </div>
  </div>

  <script>
    function cancelarEdicion() {
      // Redirige a perfil o tareas según lo que prefieras
      window.location.href = "profile.html";
    }

    document.getElementById("editProfileForm").addEventListener("submit", function(event) {
      event.preventDefault();
      alert("Cambios guardados correctamente ✅");
      // Aquí agregarías tu lógica para guardar los datos en la base de datos
    });
  </script>
</body>
</html>
