<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Tareas - Kanban Board</title>
    <link rel="stylesheet" href="../../public/css/tasks.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="header-left">
                <button class="nav-button profile-button" onclick="goToProfile()">
                    <span class="user-icon">👤</span>
                    Perfil
                </button>
                <button class="nav-button create-button" onclick="goToCreateTask()">
                    <span class="plus-icon">+</span>
                    Nueva Tarea
                </button>
            </div>
            
            <h1 class="title">LISTA DE TAREAS</h1>
            
            <div class="logo">
                <span class="logo-icon">📋</span>
                <span class="logo-text">ListUp</span>
            </div>
        </header>

        <!-- Search Bar -->
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="BUSCAR" class="search-input">
            <button class="search-button">🔍</button>
        </div>

        <!-- Kanban Board -->
        <div class="kanban-board">
            <!-- Por Hacer Column -->
            <div class="column">
                <h2 class="column-header todo-header">POR HACER</h2>
                <div class="column-content" id="todo-column">
                    <div class="task-card">
                        <div class="task-title">TÍTULO:</div>
                        <div class="task-date">AAAA/MM/DD</div>
                        <div class="task-description">Descripción de la tarea aquí...</div>
                        <div class="task-time">00:00</div>
                        <div class="task-actions">
                            <button class="edit-button" onclick="editTask(this)">Editar</button>
                            <button class="delete-button" onclick="deleteTask(this)">Borrar</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Haciendo Column -->
            <div class="column">
                <h2 class="column-header doing-header">HACIENDO</h2>
                <div class="column-content" id="doing-column">
                    <div class="task-card">
                        <div class="task-title">TÍTULO:</div>
                        <div class="task-date">AAAA/MM/DD</div>
                        <div class="task-description">Tarea en progreso...</div>
                        <div class="task-time">00:00</div>
                        <div class="task-actions">
                            <button class="edit-button" onclick="editTask(this)">Editar</button>
                            <button class="delete-button" onclick="deleteTask(this)">Borrar</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Hecho Column -->
            <div class="column">
                <h2 class="column-header done-header">HECHO</h2>
                <div class="column-content" id="done-column">
                    <div class="task-card">
                        <div class="task-title">TÍTULO:</div>
                        <div class="task-date">AAAA/MM/DD</div>
                        <div class="task-description">Tarea completada exitosamente</div>
                        <div class="task-time">00:00</div>
                        <div class="task-actions">
                            <button class="edit-button" onclick="editTask(this)">Editar</button>
                            <button class="delete-button" onclick="deleteTask(this)">Borrar</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- Modal -->
  <div id="miModal" class="modal">
    <div class="modal-content">
      <p>¿Seguro que deseas borrar esta tarea?</p>
      <button id="cancelar">Cancelar</button>
      <button id="confirmar">Eliminar</button>
    </div>
  </div>

  <!-- 👇 El script siempre debe ir aquí al final -->
  <script>
    const modal = document.getElementById("miModal");
const cancelar = document.getElementById("cancelar");
const confirmar = document.getElementById("confirmar");
let tareaSeleccionada = null;

// Cuando presionas un botón borrar
document.querySelectorAll(".delete-button").forEach(btn => {
  btn.addEventListener("click", function(e) {
    e.preventDefault(); // evita el deleteTask() que tienes en el HTML
    tareaSeleccionada = this.closest(".task-card");
    modal.style.display = "flex";
  });
});

// Botón cancelar
cancelar.addEventListener("click", () => {
  modal.style.display = "none";
  tareaSeleccionada = null;
});

// Botón confirmar
confirmar.addEventListener("click", () => {
  if (tareaSeleccionada) tareaSeleccionada.remove();
  modal.style.display = "none";
});

// Cerrar si se hace clic fuera del modal
window.addEventListener("click", (e) => {
  if (e.target === modal) {
    modal.style.display = "none";
    tareaSeleccionada = null;
  }
});
  </script>
  <script src="../../public/js/task.js"></script>
</body>
</html>
