<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Recuperar contraseña — ListUp</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../public/css/forgot.css">
</head>
<body>
  <div class="frame">
    <aside class="sidebar">
      <div class="brand">
        <img src="LOGO EMPRESA.png" alt="Logo ListUp">
        <div>
          <h1>ListUp</h1>
          <p>Recuperar contraseña</p>
        </div>
      </div>
    </aside>

    <main class="main">
      <div class="card">
        <h2>¿Olvidaste tu contraseña?</h2>
        <form>
          <label for="email" style="width:100%;text-align:left">Correo Electrónico:</label>
          <input type="email" id="email" placeholder="ejemplo@correo.com" required>
          <p class="info-text">Te enviaremos un enlace seguro a tu correo para recuperarla</p>
          <button type="submit">Enviar Enlace</button>
        </form>
        <a href="index.html" class="back-login">Volver al inicio de sesión</a>
      </div>
    </main>
  </div>
  <script src="../../public/js/resetp.js"></script>
</body>
</html>
