<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ListUp - Recuperar Contraseña</title>
  <link rel="stylesheet" href="../../public/css/styles.css">
</head>
<body>
  <div class="container">
    
    <!-- Sección Izquierda: Formulario -->
    <div class="form-container">
      <h2>¿Olvidaste tu contraseña?</h2>
      
      <form>
        <label for="email">Correo Electrónico:</label>
        <input type="email" id="email" placeholder="ejemplo@correo.com" required>
        
        <p class="info-text">
          Te enviaremos un enlace seguro a tu correo<br>
          para recuperarla
        </p>
        
        <button type="submit">Enviar Enlace</button>
      </form>

      <!-- Link para volver al login -->
      <a href="index.html" class="back-login">Volver al inicio de sesión</a>
    </div>
    
    <!-- Sección Derecha: Logo -->
    <div class="logo-container">
      <img src="https://img.icons8.com/ios-filled/100/000000/todo-list.png" alt="Logo">
      <h1>ListUp</h1>
    </div>
    
  </div>
  <script src="../../public/js/resetp.js"></script>

</body>
</html>
