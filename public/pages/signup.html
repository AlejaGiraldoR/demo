<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Registro — ListUp</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/signup.css">
</head>
<body>
  <div class="frame">
    <aside class="sidebar">
      <div class="brand">
        <img src="LOGO EMPRESA.png" alt="Logo ListUp">
        <div>
          <h1>ListUp</h1>
          <p>Registro</p>
        </div>
      </div>
    </aside>

    <main class="main">
      <div class="card">
        <h2>REGISTRARSE</h2>
        <form id="sign-up">
          <label for="name">Nombre:</label>
          <input type="text" id="name" name="firstName" placeholder="Nombre" required>

          <label for="lastname">Apellido:</label>
          <input type="text" id="lastname" name="lastName" placeholder="Apellido" required>

          <label for="age">Edad:</label>
          <input type="number" id="age" name="age" min="13" placeholder="Tu edad" required>

          <label for="email">Correo:</label>
          <input type="email" id="email" name="email" placeholder="ejemplo@correo.com" required>

          <label for="password">Contraseña:</label>
          <input type="password" id="password" name="password" placeholder="••••••••" required>

          <label for="confirm-password">Confirmar contraseña:</label>
          <input type="password" id="confirm-password" name="confirmPassword" placeholder="••••••••" required>

          <button type="submit">REGISTRARME</button>
          <a href="index.html" class="back-login">¿Ya tienes cuenta? Inicia sesión</a>
        </form>
      </div>
    </main>
  </div>
  <script src="../js/auth.js"></script>
</body>
</html>
