<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ListUp - Inicio de Sesión</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/index.css">
</head>
<body>
  <div class="frame">
    <aside class="sidebar">
      <div class="brand">
        <img src="LOGO EMPRESA.png" alt="Logo">
        <div>
          <h1>ListUp</h1>
          <p>Organiza tus tareas</p>
        </div>
      </div>
    </aside>

    <main class="main">
      <div class="card">
        <h2>INICIAR SESIÓN</h2>
        <form id="login-form">
          <label for="email">Correo:</label>
          <input type="email" id="email" name="email" placeholder="ejemplo@correo.com" required>

          <label for="password">Contraseña:</label>
          <input type="password" id="password" name="password" placeholder="• • • • • • • •" required>

          <div class="links">
            <a href="forgot.html" class="forgot">¿Olvidaste tu contraseña?</a>
            <a href="signup.html" class="register-link">¿Deseas registrarte?</a>
          </div>

          <button type="submit">INGRESAR</button>
        </form>
      </div>
    </main>
  </div>
  <script src="../js/auth.js"></script>
</body>
</html>
